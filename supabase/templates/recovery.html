<h2>Reset your Grammigo password</h2>
<p>Press the link below to choose a new password. It works once, for one hour, in any browser or on any device.</p>
<p><a href="{{ .SiteURL }}/auth/reset#token_hash={{ .TokenHash }}">Choose a new password</a></p>
<p>If you did not ask for this, ignore this email; your password stays as it is.</p>
